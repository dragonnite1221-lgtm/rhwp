name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CLAUDE_ACCESS_TOKEN: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Record trusted trigger
        run: echo "Authorized trusted repository participant."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 1
      - name: Claude review unavailable
        if: env.CLAUDE_ACCESS_TOKEN == ''
        run: echo "::notice::Skipping Claude review because CLAUDE_ACCESS_TOKEN is not configured."
      - uses: anthropics/claude-code-action@5ee796a55f92566ecd7e39d70dd613abcbea0d7c # v1.0.197
        if: env.CLAUDE_ACCESS_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_ACCESS_TOKEN }}
          # The action's default model can 404 when retired; pin a current one.
          model: claude-sonnet-4-6
          direct_prompt: |
            이 PR의 변경사항을 한국어로 리뷰해줘. 다음을 확인해:
            - 코드 품질 및 가독성
            - 버그 가능성 및 엣지 케이스
            - 보안 문제 (API 키·토큰 하드코딩, 외부 입력 경계 검증)
            - 프로젝트 규칙(CLAUDE.md/AGENTS.md) 준수 여부
            - 테스트 커버리지 누락 여부
