<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>클립보드 포맷 확인 도구</title>
<style>
body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background: #f5f5f5; }
h1 { color: #333; }
.paste-area {
    border: 3px dashed #999; padding: 40px; text-align: center;
    font-size: 18px; color: #666; background: #fff; margin: 20px 0;
    min-height: 100px; cursor: text; border-radius: 8px;
}
.paste-area:focus { border-color: #4a90d9; outline: none; background: #f0f7ff; }
.result { margin: 10px 0; }
.result h2 { color: #2c5282; margin: 20px 0 10px; font-size: 16px; }
.format-box {
    background: #fff; border: 1px solid #ddd; border-radius: 4px;
    padding: 12px; margin: 8px 0; overflow-x: auto;
}
.format-box pre {
    margin: 0; white-space: pre-wrap; word-break: break-all;
    font-size: 13px; line-height: 1.5;
}
.type-badge {
    display: inline-block; background: #4a90d9; color: #fff;
    padding: 2px 8px; border-radius: 3px; font-size: 12px; margin-right: 5px;
}
.rendered { border: 1px solid #ccc; padding: 10px; background: #fff; margin: 8px 0; }
#btn-read { padding: 10px 20px; font-size: 14px; cursor: pointer;
    background: #4a90d9; color: #fff; border: none; border-radius: 4px; }
#btn-read:hover { background: #357abd; }
.info { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>HWP 클립보드 포맷 확인 도구</h1>
<p class="info">
    HWP 편집기에서 표/텍스트/이미지를 복사(Ctrl+C)한 후, 아래 영역에 붙여넣기(Ctrl+V)하거나 버튼을 클릭하세요.
</p>

<div class="paste-area" id="paste-area" contenteditable="true" tabindex="0">
    여기에 Ctrl+V로 붙여넣기
</div>

<button id="btn-read">클립보드 직접 읽기 (Clipboard API)</button>

<div id="results"></div>

<script>
const pasteArea = document.getElementById('paste-area');
const results = document.getElementById('results');
const btnRead = document.getElementById('btn-read');
const activeObjectUrls = new Set();

function resetResults() {
    for (const url of activeObjectUrls) URL.revokeObjectURL(url);
    activeObjectUrls.clear();
    results.replaceChildren();
}

function appendText(parent, tagName, text, className) {
    const element = document.createElement(tagName);
    if (className) element.className = className;
    element.textContent = text;
    parent.append(element);
    return element;
}

function appendFormatBox(parent, text) {
    const box = document.createElement('div');
    box.className = 'format-box';
    const pre = document.createElement('pre');
    pre.textContent = text;
    box.append(pre);
    parent.append(box);
}

function appendResult(parent, type, detail) {
    const result = document.createElement('div');
    result.className = 'result';
    const badge = document.createElement('span');
    badge.className = 'type-badge';
    badge.textContent = type;
    result.append(badge, document.createTextNode(` (${detail})`));
    parent.append(result);
    return result;
}

function appendError(parent, message) {
    const error = appendText(parent, 'p', message);
    error.style.color = 'red';
}

function errorMessage(error) {
    return error instanceof Error ? error.message : String(error);
}

function appendHtmlInspection(parent, data) {
    appendText(parent, 'h2', 'HTML 렌더링 결과');
    const rendered = document.createElement('div');
    rendered.className = 'rendered';
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', '');
    frame.referrerPolicy = 'no-referrer';
    frame.srcdoc = data;
    frame.style.cssText = 'width:100%;height:300px;border:1px solid #ccc;';
    rendered.append(frame);
    parent.append(rendered);

    const hasTable = /<table[\s>]/i.test(data);
    const hasImg = /<img[\s>]/i.test(data);
    const generator = data.match(/name=["']?Generator["']?\s+content=["']([^"']+)/i);
    const sourceApp = data.match(/SourceApp[^"]*"([^"]+)"/i);
    const hwpPatterns = [
        [/hwp/i, 'hwp 문자열'],
        [/한[글컴]/i, '한글/한컴 문자열'],
        [/Hancom/i, 'Hancom 문자열'],
        [/mso-/i, 'MSO 스타일 (MS Office)'],
        [/class="xl/i, 'Excel 클래스'],
        [/StartFragment/i, 'StartFragment 마커'],
        [/EndFragment/i, 'EndFragment 마커'],
    ];
    const detectedPatterns = hwpPatterns
        .filter(([pattern]) => pattern.test(data))
        .map(([, description]) => `  [O] ${description}`);
    const inspection = [
        `표(table) 포함: ${hasTable ? 'YES' : 'NO'}`,
        `이미지(img) 포함: ${hasImg ? 'YES' : 'NO'}`,
        `Generator 메타: ${generator ? generator[1] : '없음'}`,
        `SourceApp: ${sourceApp ? sourceApp[1] : '없음'}`,
        '',
        '--- 출처 패턴 ---',
        ...detectedPatterns,
    ].join('\n');
    appendText(parent, 'h2', '감지 결과');
    appendFormatBox(parent, inspection);
}

// Ctrl+V 이벤트로 클립보드 데이터 캡처
pasteArea.addEventListener('paste', (e) => {
    e.preventDefault();
    const dt = e.clipboardData;
    console.dir(dt);
    resetResults();
    if (!dt) {
        appendText(results, 'p', 'clipboardData 없음');
        return;
    }

    appendText(results, 'h2', 'ClipboardEvent.clipboardData');
    const availableTypes = document.createElement('p');
    availableTypes.append('사용 가능한 타입: ');
    const typeList = document.createElement('b');
    typeList.textContent = [...dt.types].join(', ');
    availableTypes.append(typeList);
    results.append(availableTypes);

    for (const type of dt.types) {
        const data = dt.getData(type);
        const result = appendResult(results, type, `${data.length} chars`);
        appendFormatBox(result, data);

        if (type === 'text/html') {
            appendHtmlInspection(result, data);
        }
    }
});

// Clipboard API로 직접 읽기
btnRead.addEventListener('click', async () => {
    resetResults();
    try {
        const items = await navigator.clipboard.read();
        appendText(results, 'h2', 'Clipboard API 결과');
        appendText(results, 'p', `ClipboardItem 개수: ${items.length}`);

        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            appendText(results, 'p', `Item[${i}] 타입: ${item.types.join(', ')}`);

            for (const type of item.types) {
                try {
                    const blob = await item.getType(type);
                    if (type.startsWith('text/')) {
                        const text = await blob.text();
                        const result = appendResult(results, type, `${text.length} chars, blob size: ${blob.size}`);
                        appendFormatBox(result, text);
                    } else if (type.startsWith('image/')) {
                        const url = URL.createObjectURL(blob);
                        activeObjectUrls.add(url);
                        const result = appendResult(results, type, `blob size: ${blob.size}`);
                        const rendered = document.createElement('div');
                        rendered.className = 'rendered';
                        const image = document.createElement('img');
                        image.src = url;
                        image.style.maxWidth = '100%';
                        rendered.append(image);
                        result.append(rendered);
                    } else {
                        const result = appendResult(results, type, `blob size: ${blob.size}`);
                        // 바이너리 hexdump (처음 200바이트)
                        const arr = new Uint8Array(await blob.arrayBuffer());
                        const hexLines = [];
                        for (let j = 0; j < Math.min(arr.length, 200); j += 16) {
                            const hex = Array.from(arr.slice(j, j + 16))
                                .map(b => b.toString(16).padStart(2, '0')).join(' ');
                            const ascii = Array.from(arr.slice(j, j + 16))
                                .map(b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join('');
                            hexLines.push(`${j.toString(16).padStart(4, '0')}  ${hex.padEnd(48)}  ${ascii}`);
                        }
                        appendFormatBox(result, hexLines.join('\n'));
                    }
                } catch (err) {
                    appendError(results, `${type} 읽기 실패: ${errorMessage(err)}`);
                }
            }
        }
    } catch (err) {
        appendError(results, `Clipboard API 오류: ${errorMessage(err)}`);
    }
});
</script>
</body>
</html>
